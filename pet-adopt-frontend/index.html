<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="宠物领养之家 - 用领养代替购买，给它一个温暖的家" />
    <title>宠物领养之家</title>
    <style>
      /* 首屏兜底样式：写在 head 里，CSS/JS 尚未加载完成时也能看到反馈，避免纯白屏 */
      #app-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 10px;
        background: #fff8f2;
        color: #3f3a36;
        font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
        text-align: center;
      }
      #app-fallback .paw {
        font-size: 44px;
        animation: app-fallback-pulse 1.2s ease-in-out infinite;
      }
      #app-fallback .title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        color: #d9733a;
      }
      #app-fallback .tip {
        margin: 0;
        font-size: 13px;
        color: #8c8279;
      }
      @keyframes app-fallback-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.12); opacity: 0.72; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-fallback">
        <p class="paw">🐾</p>
        <p class="title">宠物领养之家</p>
        <p class="tip">正在加载，请稍候…</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: 'Microsoft YaHei', Arial, sans-serif">
        <h2>需要开启 JavaScript</h2>
        <p>本系统是 Vue 单页应用，请在浏览器设置中启用 JavaScript 后刷新页面。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
